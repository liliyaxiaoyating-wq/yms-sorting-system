<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陽明山國小 - 學院積分賽排行榜</title>
    <style>
        :root {
            --yang-red: #e74c3c;
            --ming-yellow: #f1c40f;
            --shan-blue: #3498db;
            --magic-gold: #ffd700;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, '微軟正黑體';
        }

        body {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--magic-gold);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
            margin-bottom: 8px;
        }

        header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        /* 學院積分卡片區域 */
        .scoreboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .house-card {
            background: rgba(30, 41, 59, 0.9);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 2px solid transparent;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .house-card:hover {
            transform: translateY(-5px);
        }

        .house-card.yang { border-color: var(--yang-red); }
        .house-card.ming { border-color: var(--ming-yellow); }
        .house-card.shan { border-color: var(--shan-blue); }

        .leader-badge {
            position: absolute;
            top: -15px;
            right: 20px;
            background: var(--magic-gold);
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
            display: none;
        }

        .house-icon { font-size: 3rem; margin-bottom: 10px; }
        .house-title { font-size: 1.8rem; font-weight: bold; margin-bottom: 5px; }

        .yang .house-title { color: #ff6b6b; }
        .ming .house-title { color: #feca57; }
        .shan .house-title { color: #54a0ff; }

        .score-display {
            font-size: 3.5rem;
            font-weight: 900;
            color: #fff;
            margin: 15px 0;
            font-family: 'Courier New', Courier, monospace;
        }

        /* 加扣分按鈕群 */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .btn-score {
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            font-size: 0.9rem;
        }

        .btn-score:hover { opacity: 0.85; }
        .btn-add { background: #22c55e; color: white; }
        .btn-sub { background: #ef4444; color: white; }

        /* 事由加分操作區 */
        .action-panel {
            background: rgba(30, 41, 59, 0.8);
            border-radius: 16px;
            padding: 20px 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .action-panel h2 {
            font-size: 1.2rem;
            color: var(--magic-gold);
            margin-bottom: 15px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr 1fr;
            gap: 12px;
        }

        select, input {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            outline: none;
            font-size: 0.95rem;
        }

        .btn-submit {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        /* 歷史紀錄表 */
        .log-section {
            background: rgba(30, 41, 59, 0.8);
            border-radius: 16px;
            padding: 20px 25px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .log-title { font-size: 1.2rem; color: var(--magic-gold); }

        .log-list {
            max-height: 250px;
            overflow-y: auto;
        }

        .log-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.9rem;
        }

        .log-item:last-child { border-bottom: none; }

        .tag-yang { color: #ff6b6b; font-weight: bold; }
        .tag-ming { color: #feca57; font-weight: bold; }
        .tag-shan { color: #54a0ff; font-weight: bold; }

        .btn-reset {
            background: #64748b;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🏆 陽明山國小 - 學院積分排行榜</h1>
        <p>「草山之好．知行合一」全校榮譽競賽即時看板</p>
    </header>

    <!-- 積分排行榜 -->
    <div class="scoreboard">
        <!-- 陽學院 -->
        <div class="house-card yang" id="card-yang">
            <div class="leader-badge" id="badge-yang">👑 領先學院</div>
            <div class="house-icon">☀️</div>
            <div class="house-title">陽學院</div>
            <p style="color:#94a3b8; font-size:0.85rem;">熱情活力．勇於挑戰</p>
            <div class="score-display" id="score-yang">0</div>
            <div class="btn-group">
                <button class="btn-score btn-add" onclick="quickScore('yang', 1)">+1</button>
                <button class="btn-score btn-add" onclick="quickScore('yang', 5)">+5</button>
                <button class="btn-score btn-add" onclick="quickScore('yang', 10)">+10</button>
                <button class="btn-score btn-sub" onclick="quickScore('yang', -1)">-1</button>
            </div>
        </div>

        <!-- 明學院 -->
        <div class="house-card ming" id="card-ming">
            <div class="leader-badge" id="badge-ming">👑 領先學院</div>
            <div class="house-icon">💡</div>
            <div class="house-title">明學院</div>
            <p style="color:#94a3b8; font-size:0.85rem;">明辨是非．愛學習</p>
            <div class="score-display" id="score-ming">0</div>
            <div class="btn-group">
                <button class="btn-score btn-add" onclick="quickScore('ming', 1)">+1</button>
                <button class="btn-score btn-add" onclick="quickScore('ming', 5)">+5</button>
                <button class="btn-score btn-add" onclick="quickScore('ming', 10)">+10</button>
                <button class="btn-score btn-sub" onclick="quickScore('ming', -1)">-1</button>
            </div>
        </div>

        <!-- 山學院 -->
        <div class="house-card shan" id="card-shan">
            <div class="leader-badge" id="badge-shan">👑 領先學院</div>
            <div class="house-icon">⛰️</div>
            <div class="house-title">山學院</div>
            <p style="color:#94a3b8; font-size:0.85rem;">穩重踏實．互助合作</p>
            <div class="score-display" id="score-shan">0</div>
            <div class="btn-group">
                <button class="btn-score btn-add" onclick="quickScore('shan', 1)">+1</button>
                <button class="btn-score btn-add" onclick="quickScore('shan', 5)">+5</button>
                <button class="btn-score btn-add" onclick="quickScore('shan', 10)">+10</button>
                <button class="btn-score btn-sub" onclick="quickScore('shan', -1)">-1</button>
            </div>
        </div>
    </div>

    <!-- 詳細登錄表單 -->
    <div class="action-panel">
        <h2>📝 登錄榮譽表現事由</h2>
        <div class="form-grid">
            <select id="targetHouse">
                <option value="yang">☀️ 陽學院</option>
                <option value="ming">💡 明學院</option>
                <option value="shan">⛰️ 山學院</option>
            </select>
            <input type="text" id="reasonInput" placeholder="請輸入加分事由（如：運動會大拉力賽第一名、語文競賽特優...）">
            <input type="number" id="pointsInput" placeholder="分數" value="5">
            <button class="btn-submit" onclick="submitLog()">送出紀錄</button>
        </div>
    </div>

    <!-- 歷史紀錄 -->
    <div class="log-section">
        <div class="log-header">
            <span class="log-title">📜 加減分歷史日誌</span>
            <button class="btn-reset" onclick="resetAll()">重置所有分數與紀錄</button>
        </div>
        <div class="log-list" id="logList">
            <!-- 歷史紀錄動態渲染區域 -->
        </div>
    </div>
</div>

<script>
    // 預設資料或讀取 LocalStorage 自動儲存
    let scores = JSON.parse(localStorage.getItem('yms_scores')) || { yang: 0, ming: 0, shan: 0 };
    let logs = JSON.parse(localStorage.getItem('yms_logs')) || [];

    const houseNames = {
        yang: '陽學院',
        ming: '明學院',
        shan: '山學院'
    };

    function updateUI() {
        // 更新分數顯示
        document.getElementById('score-yang').innerText = scores.yang;
        document.getElementById('score-ming').innerText = scores.ming;
        document.getElementById('score-shan').innerText = scores.shan;

        // 計算最高分並標示領先皇冠
        const maxScore = Math.max(scores.yang, scores.ming, scores.shan);
        
        ['yang', 'ming', 'shan'].forEach(house => {
            const badge = document.getElementById(`badge-${house}`);
            if (scores[house] === maxScore && maxScore > 0) {
                badge.style.display = 'block';
            } else {
                badge.style.display = 'none';
            }
        });

        // 更新歷史紀錄清單
        const logContainer = document.getElementById('logList');
        if (logs.length === 0) {
            logContainer.innerHTML = '<div style="text-align:center; color:#64748b; padding:15px;">尚無任何加減分紀錄</div>';
        } else {
            logContainer.innerHTML = logs.map(item => `
                <div class="log-item">
                    <span class="tag-${item.house}">【${houseNames[item.house]}】</span>
                    <span style="flex:1; margin: 0 10px; color:#e2e8f0;">${item.reason}</span>
                    <span style="font-weight:bold; color: ${item.points >= 0 ? '#22c55e' : '#ef4444'}; margin-right: 15px;">
                        ${item.points >= 0 ? '+' + item.points : item.points} 分
                    </span>
                    <span style="color:#64748b; font-size:0.8rem;">${item.time}</span>
                </div>
            `).join('');
        }

        // 保存到 LocalStorage
        localStorage.setItem('yms_scores', JSON.stringify(scores));
        localStorage.setItem('yms_logs', JSON.stringify(logs));
    }

    function quickScore(house, points) {
        scores[house] += points;
        const reason = points >= 0 ? '快速加分' : '快速扣分';
        addLog(house, reason, points);
        updateUI();
    }

    function submitLog() {
        const house = document.getElementById('targetHouse').value;
        const reason = document.getElementById('reasonInput').value.trim();
        const points = parseInt(document.getElementById('pointsInput').value);

        if (!reason) {
            alert('請輸入加分/扣分事由！');
            return;
        }
        if (isNaN(points)) {
            alert('請輸入有效的分數數值！');
            return;
        }

        scores[house] += points;
        addLog(house, reason, points);
        
        // 清空輸入框
        document.getElementById('reasonInput').value = '';
        updateUI();
    }

    function addLog(house, reason, points) {
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        logs.unshift({ house, reason, points, time });
    }

    function resetAll() {
        if (confirm('確定要將所有學院分數與紀錄歸零嗎？')) {
            scores = { yang: 0, ming: 0, shan: 0 };
            logs = [];
            updateUI();
        }
    }

    // 初始化頁面
    updateUI();
</script>

</body>
</html>
