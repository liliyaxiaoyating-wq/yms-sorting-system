<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陽明山國小 - 魔法榮譽制度管理系統</title>
    <style>
        :root {
            --yang-red: #e74c3c;
            --yang-red-dark: #c0392b;
            --ming-yellow: #f1c40f;
            --ming-yellow-dark: #f39c12;
            --shan-blue: #3498db;
            --shan-blue-dark: #2980b9;
            --magic-gold: #ffd700;
            --bg-dark: #121826;
            --card-bg: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, '微軟正黑體';
        }

        body {
            background: radial-gradient(circle at center, #1b2838 0%, #0d121d 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* 導覽列 Top Navigation Bar */
        .top-nav {
            position: relative;
            z-index: 20;
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            background: rgba(30, 41, 59, 0.9);
            padding: 10px 16px;
            border-radius: 50px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-btn {
            color: #cbd5e1;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            background: transparent;
        }

        .nav-btn:hover {
            color: var(--magic-gold);
            background: rgba(255, 255, 255, 0.08);
        }

        .nav-btn.active {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #ffffff;
            box-shadow: 0 2px 10px rgba(217, 119, 6, 0.5);
        }

        /* Stars Background */
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }

        .star {
            position: absolute; background: white; border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .main-container {
            position: relative; z-index: 10; max-width: 900px; width: 100%;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Card Layouts */
        .sorting-card, .panel-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            text-align: center;
        }

        header h1 {
            font-size: 2.2rem; color: var(--magic-gold);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); margin-bottom: 8px;
        }

        header p { color: #94a3b8; font-size: 1.05rem; margin-bottom: 25px; }

        .sorting-hat-box {
            position: relative; width: 160px; height: 160px;
            margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;
        }

        .sorting-hat-icon { font-size: 100px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5)); }
        .sorting-hat-box.animating .sorting-hat-icon { animation: hatShake 0.6s infinite ease-in-out; }

        @keyframes hatShake {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-12deg) scale(1.1); }
            50% { transform: rotate(0deg) scale(1.05); }
            75% { transform: rotate(12deg) scale(1.1); }
            100% { transform: rotate(0deg) scale(1); }
        }

        .input-group { display: flex; gap: 12px; max-width: 450px; margin: 0 auto 25px; }

        input[type="text"], input[type="number"], select {
            padding: 12px 18px; border-radius: 12px; border: 2px solid #334155;
            background: rgba(15, 23, 42, 0.8); color: #fff; font-size: 1rem; outline: none;
        }

        .btn-action {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff; font-size: 1.05rem; font-weight: bold; padding: 12px 24px;
            border: none; border-radius: 12px; cursor: pointer; transition: all 0.3s;
        }

        .btn-action:hover { background: linear-gradient(135deg, #fbbf24, #d97706); }

        .dialogue-box {
            min-height: 55px; background: rgba(15, 23, 42, 0.6); border-radius: 12px;
            padding: 12px 20px; margin-bottom: 25px; border-left: 4px solid var(--magic-gold);
            display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
        }

        .result-card {
            display: none; border-radius: 20px; padding: 25px; margin-top: 10px;
            animation: popIn 0.5s ease forwards;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); }
        }

        .result-card.yang { background: rgba(231, 76, 60, 0.25); border: 2px solid var(--yang-red); }
        .result-card.ming { background: rgba(241, 196, 15, 0.25); border: 2px solid var(--ming-yellow); }
        .result-card.shan { background: rgba(52, 152, 219, 0.25); border: 2px solid var(--shan-blue); }

        .scoreboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; margin-bottom: 25px; }
        .house-score-card { background: rgba(15, 23, 42, 0.7); border-radius: 18px; padding: 20px; text-align: center; border: 2px solid transparent; }
        .house-score-card.yang { border-color: var(--yang-red); }
        .house-score-card.ming { border-color: var(--ming-yellow); }
        .house-score-card.shan { border-color: var(--shan-blue); }

        .score-num { font-size: 3rem; font-weight: 900; margin: 10px 0; font-family: monospace; }
        .btn-sm-group { display: flex; justify-content: center; gap: 5px; }
        .btn-sm { border: none; padding: 6px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-add { background: #22c55e; color: white; }
        .btn-sub { background: #ef4444; color: white; }

        @media (max-width: 600px) {
            .input-group { flex-direction: column; }
            .btn-action { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="stars" id="starsContainer"></div>

    <!-- 頂部切換選單 -->
    <nav class="top-nav">
        <button class="nav-btn active" onclick="switchTab('sorting')">🧙‍♂️ 分類帽抽籤系統</button>
        <button class="nav-btn" onclick="switchTab('houseScores')">🏆 學院總積分排行榜</button>
        <button class="nav-btn" onclick="switchTab('studentScores')">🎒 個別學生榮譽存摺</button>
    </nav>

    <div class="main-container">

        <!-- TAB 1: 分類帽抽籤 -->
        <div id="tab-sorting" class="tab-content active">
            <div class="sorting-card">
                <header>
                    <h1>陽明山國小 魔法分類帽</h1>
                    <p>「草山之好．知行合一」全校榮譽制度學院抽籤儀式</p>
                </header>

                <div class="sorting-hat-box" id="hatBox">
                    <div class="sorting-hat-icon">🧙‍♂️</div>
                </div>

                <div class="input-group">
                    <input type="text" id="studentName" placeholder="請輸入學生姓名..." autocomplete="off">
                    <button class="btn-action" id="sortBtn" onclick="startSorting()">戴上分類帽！</button>
                </div>

                <div class="dialogue-box" id="dialogue">「嗯... 讓我看看，你的心中隱藏著什麼樣的光芒與潛力？」</div>

                <div class="result-card" id="resultCard">
                    <div style="font-size:3rem;" id="houseBadge">☀️</div>
                    <div style="font-size:1.2rem; color:#cbd5e1;" id="resStudentName">同學</div>
                    <h2 style="font-size:2.2rem; font-weight:900;" id="houseTitle">陽學院</h2>
                    <div style="font-weight:600; margin-bottom:10px;" id="houseMotto">熱情活力．勇於挑戰</div>
                    <div style="font-size:0.95rem; background:rgba(0,0,0,0.3); padding:12px; border-radius:12px;" id="houseDesc"></div>
                </div>
            </div>
        </div>

        <!-- TAB 2: 學院總積分排行榜 -->
        <div id="tab-houseScores" class="tab-content">
            <div class="panel-card">
                <header>
                    <h1>🏆 學院總積分排行榜</h1>
                    <p>全校三大學院榮譽得分即時看版</p>
                </header>

                <div class="scoreboard-grid">
                    <div class="house-score-card yang">
                        <div style="font-size:2.5rem;">☀️</div>
                        <h2 style="color:#ff6b6b;">陽學院</h2>
                        <div class="score-num" id="h-score-yang" style="color:#ff6b6b;">0</div>
                        <div class="btn-sm-group">
                            <button class="btn-sm btn-add" onclick="adjustHouse('yang', 1)">+1</button>
                            <button class="btn-sm btn-add" onclick="adjustHouse('yang', 5)">+5</button>
                            <button class="btn-sm btn-sub" onclick="adjustHouse('yang', -1)">-1</button>
                        </div>
                    </div>

                    <div class="house-score-card ming">
                        <div style="font-size:2.5rem;">💡</div>
                        <h2 style="color:#feca57;">明學院</h2>
                        <div class="score-num" id="h-score-ming" style="color:#feca57;">0</div>
                        <div class="btn-sm-group">
                            <button class="btn-sm btn-add" onclick="adjustHouse('ming', 1)">+1</button>
                            <button class="btn-sm btn-add" onclick="adjustHouse('ming', 5)">+5</button>
                            <button class="btn-sm btn-sub" onclick="adjustHouse('ming', -1)">-1</button>
                        </div>
                    </div>

                    <div class="house-score-card shan">
                        <div style="font-size:2.5rem;">⛰️</div>
                        <h2 style="color:#54a0ff;">山學院</h2>
                        <div class="score-num" id="h-score-shan" style="color:#54a0ff;">0</div>
                        <div class="btn-sm-group">
                            <button class="btn-sm btn-add" onclick="adjustHouse('shan', 1)">+1</button>
                            <button class="btn-sm btn-add" onclick="adjustHouse('shan', 5)">+5</button>
                            <button class="btn-sm btn-sub" onclick="adjustHouse('shan', -1)">-1</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB 3: 個別學生榮譽存摺 -->
        <div id="tab-studentScores" class="tab-content">
            <div class="panel-card">
                <header>
                    <h1>🎒 個別學生榮譽存摺</h1>
                    <p>登錄個人表現並加總個人點數</p>
                </header>

                <div style="display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap;">
                    <input type="text" id="st-name" placeholder="學生姓名" style="flex:1;">
                    <input type="text" id="st-class" placeholder="班級 (如: 四甲)" style="flex:1;">
                    <select id="st-house" style="flex:1;">
                        <option value="yang">☀️ 陽學院</option>
                        <option value="ming">💡 明學院</option>
                        <option value="shan">⛰️ 山學院</option>
                    </select>
                    <button class="btn-action" onclick="addNewStudent()">新增學生</button>
                </div>

                <div id="studentListContainer" style="background:rgba(15,23,42,0.6); padding:15px; border-radius:12px; min-height:120px;">
                    <div style="color:#64748b;">目前無學生資料，請在上方新增</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            event.target.classList.add('active');
        }

        const houses = {
            yang: { name: '陽學院', badge: '☀️', motto: '熱情活力．勇於挑戰', colorClass: 'yang', desc: '你擁有陽光般的熱情與豐沛的運動精神！在【陽學院】，你將與夥伴們一起勇於挑戰自我、鍛鍊身心！' },
            ming: { name: '明學院', badge: '💡', motto: '明辨是非．建立讀書好習慣', colorClass: 'ming', desc: '你擁有聰慧的頭腦與喜愛學習的心！在【明學院】，你將學會明辨是非、培養良好的閱讀與學習習慣！' },
            shan: { name: '山學院', badge: '⛰️', motto: '穩重踏實．互助合作．成就彼此', colorClass: 'shan', desc: '你擁有如山一般的穩重與值得信任的品格！在【山學院】，你將透過團隊合作、互助友愛來成就彼此！' }
        };

        function startSorting() {
            const nameInput = document.getElementById('studentName');
            const name = nameInput.value.trim();
            if (!name) { alert('請先輸入學生姓名！'); return; }

            const houseKeys = ['yang', 'ming', 'shan'];
            const selectedKey = houseKeys[Math.floor(Math.random() * houseKeys.length)];
            const house = houses[selectedKey];

            document.getElementById('dialogue').innerText = `「太棒了！${name} 同學最適合——【${house.name}】！」`;
            document.getElementById('houseBadge').innerText = house.badge;
            document.getElementById('resStudentName').innerText = `${name} 同學`;
            document.getElementById('houseTitle').innerText = house.name;
            document.getElementById('houseMotto').innerText = house.motto;
            document.getElementById('houseDesc').innerText = house.desc;

            const resCard = document.getElementById('resultCard');
            resCard.className = `result-card ${house.colorClass}`;
            resCard.style.display = 'block';
            nameInput.value = '';
        }

        let houseScores = { yang: 0, ming: 0, shan: 0 };
        function adjustHouse(h, pts) {
            houseScores[h] += pts;
            document.getElementById(`h-score-${h}`).innerText = houseScores[h];
        }

        let studentsList = [];
        function addNewStudent() {
            const name = document.getElementById('st-name').value.trim();
            const className = document.getElementById('st-class').value.trim();
            const house = document.getElementById('st-house').value;
            if(!name) { alert('請輸入學生姓名！'); return; }
            studentsList.push({ name, className, house, points: 0 });
            renderStudentsList();
            document.getElementById('st-name').value = '';
        }

        function renderStudentsList() {
            const container = document.getElementById('studentListContainer');
            if(studentsList.length === 0) {
                container.innerHTML = '<div style="color:#64748b;">目前無學生資料，請在上方新增</div>';
                return;
            }
            container.innerHTML = studentsList.map((s, idx) => `
                <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(30,41,59,0.8); padding:10px 15px; border-radius:8px; margin-bottom:8px;">
                    <div><strong>${s.name}</strong> (${s.className}) - ${houses[s.house].badge} ${houses[s.house].name}</div>
                    <div>
                        <span style="color:var(--magic-gold); font-weight:bold; margin-right:15px;">${s.points} 點</span>
                        <button class="btn-sm btn-add" onclick="studentsList[${idx}].points+=1; renderStudentsList();">+1</button>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
