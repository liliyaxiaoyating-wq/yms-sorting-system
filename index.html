<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陽明山國小 - 魔法榮譽制度管理系統</title>
    <style>
        :root {
            --yang-red: #ef4444;
            --ming-yellow: #f59e0b;
            --shan-blue: #3b82f6;
            --magic-gold: #fbbf24;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, '微軟正黑體';
        }

        body {
            background: #0f172a;
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
        }

        /* 頂部導覽列 */
        .top-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: #1e293b;
            padding: 8px 12px;
            border-radius: 40px;
            border: 2px solid #334155;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-btn {
            color: #cbd5e1;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
            background: transparent;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-btn.active {
            background: #f59e0b;
            color: #0f172a;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
        }

        .main-container {
            width: 100%;
            max-width: 1100px;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* 卡片面板 */
        .panel {
            background: #1e293b;
            border-radius: 20px;
            padding: 25px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .panel-title {
            font-size: 1.3rem;
            color: var(--magic-gold);
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }

        /* 表單佈局 */
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.88rem;
            color: #cbd5e1;
            font-weight: 600;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--magic-gold);
        }

        .btn-submit {
            background: #f59e0b;
            color: #0f172a;
            font-weight: bold;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
        }

        .btn-submit:hover { opacity: 0.9; }

        /* 學生網格卡片版面 */
        .student-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 15px;
        }

        .student-card {
            background: #0f172a;
            border-radius: 12px;
            padding: 16px;
            border: 2px solid #334155;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .student-card.yang { border-left: 6px solid var(--yang-red); }
        .student-card.ming { border-left: 6px solid var(--ming-yellow); }
        .student-card.shan { border-left: 6px solid var(--shan-blue); }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .st-name { font-size: 1.15rem; font-weight: bold; color: #fff; }
        .st-class { font-size: 0.85rem; color: #94a3b8; background: #1e293b; padding: 3px 8px; border-radius: 6px; }

        .st-house {
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .st-house.yang { color: #f87171; }
        .st-house.ming { color: #fbbf24; }
        .st-house.shan { color: #60a5fa; }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 10px 12px;
            border-radius: 8px;
        }

        .points-badge {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--magic-gold);
        }

        .btn-sm-group {
            display: flex;
            gap: 6px;
        }

        .btn-sm {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-add { background: #22c55e; color: white; }
        .btn-sub { background: #ef4444; color: white; }

        /* 學院排行榜風格 */
        .scoreboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .house-score-card {
            background: #0f172a;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 2px solid transparent;
        }

        .house-score-card.yang { border-color: var(--yang-red); }
        .house-score-card.ming { border-color: var(--ming-yellow); }
        .house-score-card.shan { border-color: var(--shan-blue); }

        .score-num {
            font-size: 3.5rem;
            font-weight: bold;
            margin: 10px 0;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <!-- 上方頁籤導覽 -->
    <nav class="top-nav">
        <button class="nav-btn" onclick="switchTab('sorting')">🧙‍♂️ 分類帽抽籤系統</button>
        <button class="nav-btn" onclick="switchTab('houseScores')">🏆 學院總積分排行榜</button>
        <button class="nav-btn active" onclick="switchTab('studentScores')">🎒 個別學生榮譽存摺</button>
    </nav>

    <div class="main-container">

        <!-- ==================== TAB 1: 分類帽抽籤 ==================== -->
        <div id="tab-sorting" class="tab-content">
            <div class="panel" style="text-align: center;">
                <h1 style="color: var(--magic-gold); margin-bottom: 10px;">陽明山國小 魔法分類帽</h1>
                <p style="color: #94a3b8; margin-bottom: 20px;">「草山之好．知行合一」全校榮譽制度學院抽籤</p>

                <div style="font-size: 80px; margin-bottom: 15px;">🧙‍♂️</div>

                <div style="max-width: 400px; margin: 0 auto 20px; display: flex; gap: 10px;">
                    <input type="text" id="studentName" placeholder="請輸入學生姓名..." autocomplete="off">
                    <button class="btn-submit" onclick="startSorting()">戴上分類帽！</button>
                </div>

                <div id="dialogue" style="background: #0f172a; padding: 15px; border-radius: 10px; color: #cbd5e1; font-style: italic; margin-bottom: 20px;">
                    「嗯... 讓我看看，你的心中隱藏著什麼樣的光芒與潛力？」
                </div>

                <div id="resultCard" style="display: none; background: #0f172a; border: 2px solid var(--magic-gold); border-radius: 16px; padding: 20px;">
                    <div id="houseBadge" style="font-size: 3rem;">☀️</div>
                    <div id="resStudentName" style="font-size: 1.2rem; color: #94a3b8;">同學</div>
                    <h2 id="houseTitle" style="font-size: 2.2rem; color: var(--magic-gold); margin: 8px 0;">陽學院</h2>
                    <div id="houseMotto" style="font-weight: bold; margin-bottom: 10px;">熱情活力．勇於挑戰</div>
                    <p id="houseDesc" style="color: #cbd5e1; font-size: 0.95rem;"></p>
                </div>
            </div>
        </div>

        <!-- ==================== TAB 2: 學院總積分排行榜 ==================== -->
        <div id="tab-houseScores" class="tab-content">
            <div class="panel">
                <div class="panel-title">🏆 三大學院總積分排行榜</div>
                <div class="scoreboard-grid">
                    <div class="house-score-card yang">
                        <div style="font-size: 2.5rem;">☀️</div>
                        <h2 style="color: #f87171;">陽學院</h2>
                        <div class="score-num" id="h-score-yang" style="color: #f87171;">0</div>
                        <div class="btn-sm-group" style="justify-content: center;">
                            <button class="btn-sm btn-add" onclick="adjustHouse('yang', 1)">+1</button>
                            <button class="btn-sm btn-add" onclick="adjustHouse('yang', 5)">+5</button>
                            <button class="btn-sm btn-sub" onclick="adjustHouse('yang', -1)">-1</button>
                        </div>
                    </div>

                    <div class="house-score-card ming">
                        <div style="font-size: 2.5rem;">💡</div>
                        <h2 style="color: #fbbf24;">明學院</h2>
                        <div class="score-num" id="h-score-ming" style="color: #fbbf24;">0</div>
                        <div class="btn-sm-group" style="justify-content: center;">
                            <button class="btn-sm btn-add" onclick="adjustHouse('ming', 1)">+1</button>
                            <button class="btn-sm btn-add" onclick="adjustHouse('ming', 5)">+5</button>
                            <button class="btn-sm btn-sub" onclick="adjustHouse('ming', -1)">-1</button>
                        </div>
                    </div>

                    <div class="house-score-card shan">
                        <div style="font-size: 2.5rem;">⛰️</div>
                        <h2 style="color: #60a5fa;">山學院</h2>
                        <div class="score-num" id="h-score-shan" style="color: #60a5fa;">0</div>
                        <div class="btn-sm-group" style="justify-content: center;">
                            <button class="btn-sm btn-add" onclick="adjustHouse('shan', 1)">+1</button>
                            <button class="btn-sm btn-add" onclick="adjustHouse('shan', 5)">+5</button>
                            <button class="btn-sm btn-sub" onclick="adjustHouse('shan', -1)">-1</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== TAB 3: 個別學生榮譽存摺 ==================== -->
        <div id="tab-studentScores" class="tab-content active">
            <!-- 新增學生面板 -->
            <div class="panel">
                <div class="panel-title">👤 新增學生名單</div>
                <div class="form-row">
                    <div class="form-group">
                        <label>學生姓名</label>
                        <input type="text" id="st-name" placeholder="輸入姓名...">
                    </div>
                    <div class="form-group">
                        <label>年級 / 班級</label>
                        <input type="text" id="st-class" placeholder="如：四年甲班">
                    </div>
                    <div class="form-group">
                        <label>所屬學院</label>
                        <select id="st-house">
                            <option value="yang">☀️ 陽學院</option>
                            <option value="ming">💡 明學院</option>
                            <option value="shan">⛰️ 山學院</option>
                        </select>
                    </div>
                    <button class="btn-submit" onclick="addNewStudent()">新增學生</button>
                </div>
            </div>

            <!-- 學生卡片清單面板 -->
            <div class="panel">
                <div class="panel-title">🎒 學生榮譽點數榜</div>
                
                <div class="student-grid" id="studentGrid">
                    <!-- 動態渲染卡片 -->
                </div>
            </div>
        </div>

    </div>

    <script>
        // 頁籤切換
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabId).classList.add('active');
            event.target.classList.add('active');
        }

        const houses = {
            yang: { name: '陽學院', badge: '☀️', motto: '熱情活力．勇於挑戰', desc: '你擁有陽光般的熱情與豐沛的運動精神！在【陽學院】，你將與夥伴們一起勇於挑戰自我！' },
            ming: { name: '明學院', badge: '💡', motto: '明辨是非．愛學習', desc: '你擁有聰慧的頭腦與喜愛學習的心！在【明學院】，你將培養良好的閱讀與學習習慣！' },
            shan: { name: '山學院', badge: '⛰️', motto: '穩重踏實．互助合作', desc: '你擁有如山一般的穩重與值得信任的品格！在【山學院】，你將透過團隊合作成就彼此！' }
        };

        // 分類帽邏輯
        function startSorting() {
            const nameInput = document.getElementById('studentName');
            const name = nameInput.value.trim();
            if (!name) { alert('請輸入學生姓名！'); return; }

            const keys = ['yang', 'ming', 'shan'];
            const selected = keys[Math.floor(Math.random() * keys.length)];
            const house = houses[selected];

            document.getElementById('dialogue').innerText = `「太棒了！${name} 同學最適合——【${house.name}】！」`;
            document.getElementById('houseBadge').innerText = house.badge;
            document.getElementById('resStudentName').innerText = `${name} 同學`;
            document.getElementById('houseTitle').innerText = house.name;
            document.getElementById('houseMotto').innerText = house.motto;
            document.getElementById('houseDesc').innerText = house.desc;

            document.getElementById('resultCard').style.display = 'block';
            nameInput.value = '';
        }

        // 學院分數邏輯
        let houseScores = { yang: 0, ming: 0, shan: 0 };
        function adjustHouse(h, pts) {
            houseScores[h] += pts;
            document.getElementById(`h-score-${h}`).innerText = houseScores[h];
        }

        // 個別學生邏輯
        let studentsList = JSON.parse(localStorage.getItem('yms_students_v2')) || [
            { name: '王小明', className: '111', house: 'yang', points: 0 },
            { name: '陳大同', className: '四年甲班', house: 'ming', points: 5 }
        ];

        function saveData() {
            localStorage.setItem('yms_students_v2', JSON.stringify(studentsList));
            renderStudents();
        }

        function addNewStudent() {
            const name = document.getElementById('st-name').value.trim();
            const className = document.getElementById('st-class').value.trim();
            const house = document.getElementById('st-house').value;

            if (!name) { alert('請輸入學生姓名！'); return; }

            studentsList.unshift({ name, className, house, points: 0 });
            saveData();

            document.getElementById('st-name').value = '';
            document.getElementById('st-class').value = '';
        }

        function adjustPoints(index, pts) {
            studentsList[index].points += pts;
            saveData();
        }

        function renderStudents() {
            const grid = document.getElementById('studentGrid');
            if (studentsList.length === 0) {
                grid.innerHTML = '<div style="color: #94a3b8; text-align: center; grid-column: 1/-1;">尚無學生資料，請在上方新增</div>';
                return;
            }

            grid.innerHTML = studentsList.map((s, idx) => {
                const h = houses[s.house];
                return `
                    <div class="student-card ${s.house}">
                        <div>
                            <div class="card-top">
                                <span class="st-name">${s.name}</span>
                                <span class="st-class">${s.className || '無班級'}</span>
                            </div>
                            <div class="st-house ${s.house}">${h.badge} ${h.name}</div>
                        </div>
                        <div class="card-bottom">
                            <span class="points-badge">${s.points} 點</span>
                            <div class="btn-sm-group">
                                <button class="btn-sm btn-add" onclick="adjustPoints(${idx}, 1)">+1</button>
                                <button class="btn-sm btn-add" onclick="adjustPoints(${idx}, 5)">+5</button>
                                <button class="btn-sm btn-sub" onclick="adjustPoints(${idx}, -1)">-1</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 初始化渲染
        renderStudents();
    </script>
</body>
</html>
